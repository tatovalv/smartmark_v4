version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install
    build:
      commands:
        - pnpm run build
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .next/standalone/**/*
      - .next/static/**/*

